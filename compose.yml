version: "3.4"

services:
  postgresql_database:
    container_name: postgres_db
    image: postgres:latest
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin1234
      - POSTGRES_DB=healthCheck
      - TZ=UTC
      - PGTZ=UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - database-data:/var/lib/postgresql/data/
    networks:
      - est-network

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - est-network

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@org.in
      - PGADMIN_DEFAULT_PASSWORD=admin1234
      - TZ=UTC
    ports:
      - "5050:80"
    restart: always
    volumes:
      - pgadmin:/root/.pgadmin
    networks:
      - est-network

  estapp:
    container_name: estapp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - postgresql_database
      - redis
    networks:
      - est-network
    environment:
      - TZ=UTC
      - JAVA_TOOL_OPTIONS=-Duser.timezone=UTC
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/healthCheck
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin1234
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379

volumes:
  database-data:
  redis-data:
  pgadmin:

networks:
  est-network:
    driver: bridge
